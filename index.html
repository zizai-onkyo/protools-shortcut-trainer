<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">   <!-- β公開中：検索避け -->
<title>Pro Tools ショートカット トレーナー</title>
<style>
  :root{--ink:#22282c;--soft:#6b7276;--accent:#0e6b66;--accent-l:#e0efed;--line:#dcdfe0;
    --bg:#fbfcfc;--ok:#12805a;--ng:#c0392b;--gold:#c77a0f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:34px 22px 60px}
  h1{font-size:26px;margin:0 0 6px} h2{font-size:15px;margin:0 0 12px;color:var(--accent)}
  .sub{color:var(--soft);font-size:13px;margin:0 0 24px;line-height:1.8}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{font:inherit;padding:10px 18px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button:hover{background:#f2f5f5}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;padding:13px 30px;font-size:16px}
  button.primary:hover{filter:brightness(1.08)}
  button.sel{background:var(--accent-l);border-color:var(--accent);color:var(--accent);font-weight:700}
  label{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px}
  .muted{color:var(--soft);font-size:13px;line-height:1.8}
  .k{display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:5px 10px;
    border:1px solid #9aa2a6;border-radius:6px;background:#fff;font-weight:700;font-size:17px;
    box-shadow:0 1px 0 rgba(0,0,0,.06)}
  .k.big{min-width:clamp(38px,5vw,52px);padding:10px 18px;font-size:clamp(20px,3vw,28px);border-radius:9px}
  .sep{color:var(--soft)}
  /* ゲーム画面 */
  #play{display:none;position:fixed;inset:0;background:var(--bg);z-index:10;
    flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}
  #play.on{display:flex}
  .hud{position:fixed;top:0;left:0;right:0;padding:14px 22px;display:flex;justify-content:space-between;
    align-items:center;font-size:14px;color:var(--soft)}
  .score{font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .combo{color:var(--gold);font-weight:700}
  .timebar{position:fixed;top:0;left:0;right:0;height:5px;background:#e7eaea}
  .timebar > i{display:block;height:100%;background:var(--accent);width:100%}
  .timebar.warn > i{background:var(--ng)}
  .qcat{color:var(--accent);font-size:clamp(12px,1.6vw,14px);font-weight:700;letter-spacing:.05em}
  .qact{font-size:clamp(22px,4.2vw,40px);font-weight:700;margin:14px 0 8px;max-width:min(820px,92vw);line-height:1.4}
  .qnote{color:var(--soft);font-size:14px;max-width:640px;min-height:22px}
  .mods{display:flex;gap:12px;margin-top:38px}
  .mod{width:clamp(42px,7vw,56px);height:clamp(36px,5.6vw,46px);border-radius:9px;border:1.5px solid var(--line);color:#b7bec1;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#fff}
  .mod.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .seq{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:22px;min-height:52px}
  .slot{min-width:clamp(40px,5vw,54px);padding:9px 14px;border-radius:9px;border:2px dashed #cfd5d6;
    color:#c3c9cb;font-size:clamp(18px,2.6vw,24px);font-weight:700;background:#fff}
  .slot.done{border-style:solid;border-color:var(--accent);background:var(--accent-l);color:var(--accent)}
  .slot.now{border-color:var(--accent);border-style:solid;color:var(--soft);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{background:#f0f7f6}}
  .seqarrow{color:var(--soft);font-size:18px}
  .verdict{min-height:64px;margin-top:26px;font-size:19px;font-weight:700}
  .verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
  .answer{margin-top:8px;display:flex;gap:7px;align-items:center;justify-content:center}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle}
  th{background:var(--accent-l);color:var(--accent);font-size:12px}
  .big{font-size:40px;font-weight:700}
  .stat{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 4px}
  .stat div span{display:block;color:var(--soft);font-size:12px}
  .chk{font-size:13px;padding:3px 9px;border-radius:999px;display:inline-block}
  .banner{border-radius:12px;padding:16px 20px;margin-bottom:16px;font-size:14px;line-height:1.8}
  .banner.warn{background:#fdf4e6;border:1px solid #ecd3a6;color:#8a5a12}
  .banner.stop{background:#fdeceb;border:1px solid #f0c4bf;color:#a5342a}
  .banner b{font-weight:700}
  .chk.y{background:#e3f3ec;color:var(--ok)} .chk.n{background:#fbe8e5;color:var(--ng)}
</style>
</head>
<body>
<div class="wrap" id="home">
  <h1>Pro Tools ショートカット トレーナー</h1>
  <p class="sub">機能名が出るので、対応するショートカットを実際に押してください。<br>
    Chrome / Edge で全画面にすると、⌘+N などブラウザに取られるキーも判定できます。</p>
  <div id="warn"></div>

  <div class="card">
    <h2>出題範囲</h2>
    <div class="row" id="modes"></div>
    <div class="row" style="margin-top:12px" id="catrow"></div>
  </div>

  <div class="card">
    <h2>設定</h2>
    <label><input type="checkbox" id="weighted" checked> 重要度 ◎ の問題を多めに出す（△ はほとんど出しません）</label>
    <label><input type="checkbox" id="nocmd"> ⌘ を使う問題を除く（Chrome / Edge 以外で遊ぶとき）</label>
    <label><input type="checkbox" id="uselock" checked> Keyboard Lock を使う（推奨）</label>
    <label><input type="checkbox" id="hasnumpad" checked> テンキーがある</label>
    <label><input type="checkbox" id="showhint"> 3秒たったら答えを表示する（練習モード）</label>
    <div class="muted" id="poolinfo" style="margin-top:8px"></div>
  </div>

  <div class="row"><button class="primary" id="start">スタート</button>
    <span class="muted">1ラウンド20問／1問8秒</span></div>

  <div id="resultbox" style="display:none;margin-top:22px"></div>
  <div id="weakbox" style="display:none;margin-top:14px"></div>
</div>

<div id="play">
  <div class="timebar"><i id="tbar"></i></div>
  <div class="hud">
    <div><span id="qnum"></span></div>
    <div class="row" style="gap:20px">
      <div class="combo" id="combo"></div>
      <div class="score" id="score">0</div>
    </div>
  </div>
  <div class="qcat" id="qcat"></div>
  <div class="qact" id="qact"></div>
  <div class="qnote" id="qnote"></div>
  <div class="seq" id="seq"></div>
  <div class="mods">
    <div class="mod" data-m="Meta">⌘</div><div class="mod" data-m="Alt">⌥</div>
    <div class="mod" data-m="Control">⌃</div><div class="mod" data-m="Shift">⇧</div>
  </div>
  <div class="verdict" id="verdict"></div>
  <div style="position:fixed;bottom:22px"><button id="quit">やめる</button></div>
</div>

const $ = s => document.querySelector(s);

const MODSIGN = {Meta:"⌘", Alt:"⌥", Control:"⌃", Shift:"⇧"};
// 重要度ごとの出やすさ。◎ は △ の 8 倍出る
const WEIGHT = {"◎": 8, "○": 3, "△": 1};
const MISS_BOOST = 3;        // 苦手な項目は最大 4 倍まで出やすくなる

let mode = "star", cat = null;

/* ---------- 環境チェック ---------- */
const UA = navigator.userAgent;
const IS_MOBILE = /iPhone|iPad|iPod|Android/.test(UA) || (navigator.maxTouchPoints > 1 && !/Macintosh/.test(UA));
const IS_CHROMIUM = /Chrome\//.test(UA) || /Edg\//.test(UA);
const HAS_LOCK = !!(navigator.keyboard && navigator.keyboard.lock);
(function envCheck(){
  const b = [];
  if (IS_MOBILE)
    b.push(['stop', '<b>このゲームは物理キーボードが必要です。</b>パソコン（Mac）の Chrome で開いてください。']);
  else if (!IS_CHROMIUM)
    b.push(['warn', '<b>Chrome または Edge で開くことをおすすめします。</b>このブラウザでは ⌘ を使う問題がブラウザ側に取られてしまい、正しく判定できません。' +
                    '下の「⌘ を使う問題を除く」を ON にすれば、このままでも遊べます。']);
  else if (!HAS_LOCK || !window.isSecureContext)
    b.push(['warn', '<b>⌘+N などの一部のキーが判定できない可能性があります。</b>https:// のURLを Chrome / Edge で開くと、すべての問題が判定できます。']);
  $("#warn").innerHTML = b.map(([k,t]) => `<div class="banner ${k}">${t}</div>`).join("");
  if (!IS_CHROMIUM || !HAS_LOCK){ $("#nocmd").checked = true; }
  if (!HAS_LOCK){ $("#uselock").checked = false; $("#uselock").disabled = true; }
})();

function store(){ try { return JSON.parse(localStorage.getItem(STORE) || "{}"); } catch(e){ return {}; } }
function saveStore(o){ try { localStorage.setItem(STORE, JSON.stringify(o)); } catch(e){} }

function pool(){
  const st = store(), pad = $("#hasnumpad").checked;
  let qs = DATA.questions.filter(q => pad || !q.numpad);
  if ($("#nocmd").checked) qs = qs.filter(q => !q.meta);
  if (mode === "star") qs = qs.filter(q => q.star);
  if (mode === "seq")  qs = qs.filter(q => q.type === "seq" && q.steps.some(st => st.kind === "digits"));
  if (mode === "cat")  qs = qs.filter(q => q.cat === (cat || DATA.cats[0]));
  if (mode === "weak"){
    const miss = st.miss || {};
    qs = qs.filter(q => miss[q.act]).sort((a,b) => (miss[b.act]||0) - (miss[a.act]||0));
  }
  return qs;
}
function weightOf(q, miss){
  const w = $("#weighted").checked ? (WEIGHT[q.freq] || 3) : 1;
  return w * (1 + Math.min(MISS_BOOST, miss[q.act] || 0));
}
/** 重み付きで重複なく n 問選ぶ */
function pickRound(qs, n){
  const miss = store().miss || {};
  const rest = qs.slice(), out = [];
  while (out.length < n && rest.length){
    const ws = rest.map(q => weightOf(q, miss));
    let r = Math.random() * ws.reduce((a,b) => a+b, 0), i = 0;
    while (r > ws[i] && i < rest.length - 1){ r -= ws[i]; i++; }
    out.push(rest.splice(i, 1)[0]);
  }
  return out;
}
/** 1ラウンド分の並びを作る。順番入力モードは母数が少ないので繰り返して埋める */
function buildRound(p){
  if (mode !== "seq") return pickRound(p, ROUND);
  const out = [];
  while (out.length < ROUND){
    const batch = pickRound(p, Math.min(p.length, ROUND - out.length));
    if (!batch.length) break;
    out.push(...batch);
  }
  return out;
}
function updatePool(){
  const qs = pool(), n = qs.length;
  const c = {"◎":0,"○":0,"△":0};
  qs.forEach(q => c[q.freq] = (c[q.freq] || 0) + 1);
  let txt = `出題対象 ${n} 問（◎ ${c["◎"]} / ○ ${c["○"]} / △ ${c["△"]}）`;
  if (n && $("#weighted").checked){
    const miss = store().miss || {};
    const tot = qs.reduce((a,q) => a + weightOf(q, miss), 0);
    const share = f => Math.round(qs.filter(q => q.freq === f)
                        .reduce((a,q) => a + weightOf(q, miss), 0) / tot * ROUND * 10) / 10;
    txt += `　→ 1ラウンド20問の目安：◎ ${share("◎")}問 / ○ ${share("○")}問 / △ ${share("△")}問`;
  }
  if (mode === "weak" && !n) txt = "まだ苦手データがありません。まず★基本を1ラウンド遊んでください";
  if (mode === "seq"){
    txt = n ? `順番に押す問題 ${n} 問を、数字を変えながら 20 問くり返します`
            : "順番入力の問題はテンキーを使います。「テンキーがある」にチェックを入れてください";
  }
  $("#poolinfo").textContent = txt;
}
updatePool();
$("#hasnumpad").onchange = updatePool;
$("#weighted").onchange = updatePool;
$("#nocmd").onchange = updatePool;

/* ---------- ゲーム ---------- */
let queue = [], qi = 0, score = 0, combo = 0, maxCombo = 0, log = [], timer = null, t0 = 0, hintTimer = null, locked = false;
let seqSteps = null, seqIdx = 0, curLimit = LIMIT, curAnswer = "";

const modsOf = ev => {
  const m = [];
  if (ev.metaKey) m.push("Meta");
  if (ev.altKey) m.push("Alt");
  if (ev.ctrlKey) m.push("Control");
  if (ev.shiftKey) m.push("Shift");
  return m.sort();
};
/** 順番入力を、実際に押す並びへ展開する（数字はランダム） */
function expandSeq(q){
  const n = 1 + Math.floor(Math.random() * 99);
  const steps = [];
  for (const st of q.steps){
    if (st.kind === "digits")
      String(n).split("").forEach(d => steps.push({mods: [], codes: ["Numpad" + d], label: d}));
    else steps.push(st);
  }
  return {n, steps};
}
function renderSlots(){
  if (!seqSteps){ $("#seq").innerHTML = ""; return; }
  $("#seq").innerHTML = seqSteps.map((st, i) =>
    `<span class="slot ${i < seqIdx ? "done" : (i === seqIdx ? "now" : "")}">${
      i < seqIdx ? esc(st.label) : "？"}</span>`).join('<span class="seqarrow">→</span>');
}

$("#start").onclick = async () => {
  const p = pool();
  if (!p.length){ alert("出題できる問題がありません"); return; }
  queue = buildRound(p);
  qi = 0; score = 0; combo = 0; maxCombo = 0; log = [];
  $("#play").classList.add("on");
  try { await document.documentElement.requestFullscreen(); } catch(e){}
  if ($("#uselock").checked && navigator.keyboard && navigator.keyboard.lock){
    try { await navigator.keyboard.lock(); locked = true; } catch(e){}
  }
  next();
};
$("#quit").onclick = () => endGame(true);

function keyHTML(key, big){
  const cls = big ? "k big" : "k";
  return key.split(/( \+ | \/ | → | ｜ )/).map(p => {
    if (p === " + ") return '<span class="sep">＋</span>';
    if (p === " / ") return '<span class="sep">/</span>';
    if (p === " → ") return '<span class="sep">→</span>';
    if (p === " ｜ ") return '<span class="sep">または</span>';
    if (!p.trim()) return "";
    return `<span class="${cls}">${esc(p.trim())}</span>`;
  }).join("");
}

function next(){
  clearInterval(timer); clearTimeout(hintTimer);
  if (qi >= queue.length){ endGame(false); return; }
  const q = queue[qi];
  seqSteps = null; seqIdx = 0;
  curLimit = q.type === "seq" ? LIMIT * 1.8 : LIMIT;
  let prompt = q.act;
  if (q.type === "seq"){
    const ex = expandSeq(q);
    seqSteps = ex.steps;
    prompt = q.act.replace("{数字}", ex.n);
    curAnswer = seqSteps.map(st => st.label).join(" → ");
  } else {
    curAnswer = q.key;
  }
  renderSlots();
  $("#qcat").textContent = q.cat + "　›　" + q.sec;
  $("#qact").textContent = prompt;
  $("#qnote").textContent = "";
  $("#verdict").textContent = ""; $("#verdict").className = "verdict";
  $("#qnum").textContent = `${qi+1} / ${queue.length}`;
  $("#score").textContent = score;
  $("#combo").textContent = combo >= 2 ? combo + " コンボ" : "";
  document.querySelectorAll(".mod").forEach(m => m.classList.remove("on"));
  t0 = performance.now();
  $("#tbar").parentElement.classList.remove("warn");
  timer = setInterval(() => {
    const left = 1 - (performance.now() - t0) / curLimit;
    $("#tbar").style.width = Math.max(0, left * 100) + "%";
    $("#tbar").parentElement.classList.toggle("warn", left < .3);
    if (left <= 0) judge(null);
  }, 40);
  if ($("#showhint").checked)
    hintTimer = setTimeout(() => { $("#qnote").innerHTML = "ヒント： " + esc(curAnswer); }, 3000);
}

function judge(ev){
  const q = queue[qi];
  if (ev && q.type === "seq" && seqSteps){
    const st = seqSteps[seqIdx];
    if (modsOf(ev).join("+") === [...st.mods].sort().join("+") && st.codes.includes(ev.code)){
      seqIdx++; renderSlots();
      if (seqIdx < seqSteps.length) return;      // まだ途中：時間は止めない
      return settle(true);
    }
    return settle(false);
  }
  if (!ev) return settle(false);
  const m = modsOf(ev).join("+");
  settle(q.alts.some(a => m === [...a.mods].sort().join("+") && a.codes.includes(ev.code)));
}

function settle(ok){
  const q = queue[qi];
  clearInterval(timer); clearTimeout(hintTimer);
  const ms = performance.now() - t0;
  if (ok){
    combo++; maxCombo = Math.max(maxCombo, combo);
    const speed = Math.max(0, 1 - ms / curLimit);
    const gained = Math.round((100 + speed * 100) * Math.min(5, 1 + (combo - 1) * .2));
    score += gained;
    $("#verdict").className = "verdict ok";
    $("#verdict").innerHTML = `正解　<span style="font-weight:400;font-size:15px">${(ms/1000).toFixed(2)} 秒　+${gained}</span>`;
  } else {
    combo = 0;
    $("#verdict").className = "verdict ng";
    $("#verdict").innerHTML = (ms >= curLimit ? "時間切れ" : "ちがいます") +
      `<div class="answer">${keyHTML(curAnswer, true)}</div>`;
    if (seqSteps){ seqIdx = seqSteps.length; renderSlots(); }
  }
  log.push({q, ok, ms, answer: curAnswer});
  qi++;
  setTimeout(next, ok ? 550 : 1700);
}

function endGame(aborted){
  clearInterval(timer); clearTimeout(hintTimer);
  if (locked && navigator.keyboard) navigator.keyboard.unlock();
  locked = false;
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  $("#play").classList.remove("on");
  if (!log.length) return;
  const st = store(); st.miss = st.miss || {};
  log.forEach(l => { if (!l.ok) st.miss[l.q.act] = (st.miss[l.q.act] || 0) + 1;
                     else if (st.miss[l.q.act]) st.miss[l.q.act]--; });
  const oks = log.filter(l => l.ok);
  st.best = Math.max(st.best || 0, score);
  saveStore(st);
  const avg = oks.length ? oks.reduce((a,l) => a + l.ms, 0) / oks.length / 1000 : 0;
  $("#resultbox").style.display = "";
  $("#resultbox").innerHTML = `
    <div class="card">
      <h2>${aborted ? "途中結果" : "結果"}</h2>
      <div class="stat">
        <div><span>スコア</span><b class="big">${score}</b></div>
        <div><span>正解</span><b class="big">${oks.length}<span style="font-size:16px">/${log.length}</span></b></div>
        <div><span>平均反応</span><b class="big">${avg.toFixed(2)}<span style="font-size:16px">秒</span></b></div>
        <div><span>最大コンボ</span><b class="big">${maxCombo}</b></div>
        <div><span>ベスト</span><b class="big">${st.best}</b></div>
      </div>
      ${log.filter(l => !l.ok).length ? `<h2 style="margin-top:20px">まちがえた問題</h2>
        <table><tr><th>機能</th><th>正解</th></tr>` +
        log.filter(l => !l.ok).map(l => `<tr><td>${esc(l.q.act)}</td><td>${keyHTML(l.answer || l.q.key)}</td></tr>`).join("") +
        `</table>` : '<div class="muted" style="margin-top:14px">全問正解でした。</div>'}
    </div>`;
  const miss = Object.entries(st.miss).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
  $("#weakbox").style.display = miss.length ? "" : "none";
  $("#weakbox").innerHTML = miss.length ? `<div class="card"><h2>苦手リスト（${miss.length}）</h2>
    <div class="muted">「苦手だけ」モードで重点的に練習できます。</div>
    <table><tr><th>機能</th><th>ミス</th></tr>` +
    miss.slice(0,15).map(([a,v]) => `<tr><td>${esc(a)}</td><td>${v}</td></tr>`).join("") + `</table></div>` : "";
  updatePool();
  window.scrollTo(0, document.body.scrollHeight);
}

document.addEventListener("keydown", ev => {
  if (!$("#play").classList.contains("on")) return;
  ev.preventDefault(); ev.stopPropagation();
  document.querySelectorAll(".mod").forEach(m =>
    m.classList.toggle("on", {Meta:ev.metaKey,Alt:ev.altKey,Control:ev.ctrlKey,Shift:ev.shiftKey}[m.dataset.m]));
  if (/^(Meta|Alt|Control|Shift)(Left|Right)$/.test(ev.code)) return;
  if ($("#verdict").textContent) return;      // 判定表示中は受け付けない
  judge(ev);
}, true);
document.addEventListener("keyup", () => {
  if (!$("#play").classList.contains("on")) return;
  document.querySelectorAll(".mod").forEach(m => m.classList.remove("on"));
}, true);
</script>
</body>
</html>
